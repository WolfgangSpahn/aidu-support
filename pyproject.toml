[project]
name = "aidu-support"
version = "0.1.3"
description = "General support utilities and infrastructural primitives for AIDu."
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    "rich>=14.3.2",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pluggy>=1.0",
    "ruff",
    "black",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aidu", "src/scoring"]

# -------------------------------------------------------------------
# Linter / formatter configuration
# -------------------------------------------------------------------

[tool.ruff]
line-length = 180
exclude = ["__pycache__", "build", "dist", ".venv"]

[tool.black]
line-length = 180
target-version = ["py311"]
