[project]
name = "aidu-support"
version = "0.1.0"
description = "General support utilities and infrastructural primitives for AIDu."
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = { "src" = "" }
packages = ["src/aidu/support"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]